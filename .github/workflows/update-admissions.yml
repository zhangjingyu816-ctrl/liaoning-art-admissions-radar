name: Update admissions radar

on:
  workflow_dispatch:
  schedule:
    # GitHub cron 使用 UTC；01:00-13:30 UTC 对应北京时间 09:00-21:30。
    - cron: "0,30 1-13 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "dist/data/**"

permissions:
  contents: write

concurrency:
  group: admissions-radar-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check official admissions sources
        run: node scripts/update-admissions.mjs
      - name: Save newly discovered notices
        run: |
          if git diff --quiet -- dist/data; then
            exit 0
          fi
          git config user.name "admissions-radar-bot"
          git config user.email "admissions-radar-bot@users.noreply.github.com"
          git add dist/data
          git commit -m "data: refresh official admissions notices"
          git push

